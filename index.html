<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GECKO · AI Frontier Intelligence Platform — AI 前沿情报聚合、事件追踪、趋势雷达与每日智能报告">
  <meta name="theme-color" content="#070b12">
  <title>GECKO · AI Frontier Intelligence</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="bgCanvas" aria-hidden="true"></canvas>
  <div class="aurora" aria-hidden="true"></div>

  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <a class="brand" href="#/" data-nav>
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">
          <strong>GECKO</strong>
          <em data-i18n="brand.sub">AI Frontier Intelligence</em>
        </span>
      </a>

      <nav class="main-nav" id="mainNav" aria-label="Main">
        <a href="#/" data-nav data-i18n="nav.home">首页</a>
        <a href="#/feed" data-nav data-i18n="nav.feed">信息流</a>
        <a href="#/trends" data-nav data-i18n="nav.trends">趋势雷达</a>
        <a href="#/research" data-nav data-i18n="nav.research">论文</a>
        <a href="#/models" data-nav data-i18n="nav.models">模型</a>
        <a href="#/projects" data-nav data-i18n="nav.projects">开源</a>
        <a href="#/reports" data-nav data-i18n="nav.reports">日报</a>
        <a href="#/ask" data-nav data-i18n="nav.ask">Ask AI</a>
        <div class="nav-more">
          <button class="nav-more-btn" aria-haspopup="true" data-i18n="nav.more">更多</button>
          <div class="nav-more-menu">
            <a href="#/organizations" data-nav data-i18n="nav.organizations">组织动态</a>
            <a href="#/benchmarks" data-nav data-i18n="nav.benchmarks">基准评测</a>
            <a href="#/deep-research" data-nav data-i18n="nav.deep">深度研究</a>
            <a href="#/sources" data-nav data-i18n="nav.sources">来源健康</a>
            <a href="#/about" data-nav data-i18n="nav.about">关于</a>
          </div>
        </div>
      </nav>

      <div class="header-actions">
        <button class="icon-btn" id="searchBtn" title="搜索 (/)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
        <div class="lang-switcher" role="group" aria-label="Language">
          <button class="lang-btn active" data-lang="zh">中</button>
          <button class="lang-btn" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="ja">日</button>
        </div>
        <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">🌓</button>
        <button class="icon-btn nav-toggle" id="navToggle" aria-label="Menu">☰</button>
      </div>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="brand-mark small" aria-hidden="true"></span>
        <div>
          <strong>GECKO</strong>
          <span data-i18n="footer.tagline">AI Frontier Intelligence Platform</span>
        </div>
      </div>
      <div class="footer-meta">
        <span id="footerUpdated">—</span>
        <span class="dot">·</span>
        <a href="#/sources" data-nav data-i18n="footer.sources">来源健康</a>
        <span class="dot">·</span>
        <a href="#/about" data-nav data-i18n="footer.about">关于与数据说明</a>
        <span class="dot">·</span>
        <a href="https://github.com/HuanMoovo" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </footer>

  <!-- 全局搜索面板 -->
  <div class="search-overlay" id="searchOverlay">
    <div class="search-panel glass">
      <input type="search" id="searchInput" data-i18n-placeholder="search.placeholder"
             placeholder="搜索事件 / 文档 / 实体…" autocomplete="off">
      <div class="search-results" id="searchResults"></div>
      <div class="search-hint" data-i18n="search.hint">Enter 打开首个结果 · Esc 关闭 · 支持中英日关键词与实体</div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/views-home.js"></script>
  <script src="js/views-feed.js"></script>
  <script src="js/views-trends.js"></script>
  <script src="js/views-lib.js"></script>
  <script src="js/views-report.js"></script>
  <script src="js/views-ask.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
